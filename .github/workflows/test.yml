name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu quality and cross-builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' go_files < <(git ls-files -z '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Cross-compile all release targets
        shell: bash
        run: |
          mkdir -p build
          while read -r goos goarch; do
            suffix=""
            if [[ "$goos" == "windows" ]]; then
              suffix=".exe"
            fi
            output="build/clodex-${goos}-${goarch}${suffix}"
            echo "Building ${goos}/${goarch} -> ${output}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -o "$output" ./cmd/clodex
          done <<'TARGETS'
          darwin amd64
          darwin arm64
          linux amd64
          linux arm64
          windows amd64
          windows arm64
          TARGETS
          test "$(find build -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6

  native:
    name: Native suite (${{ matrix.runner }})
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            race: true
          - runner: windows-latest
            race: true
          - runner: ubuntu-24.04-arm
            race: true
          - runner: windows-11-arm
            race: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        if: ${{ matrix.race }}
        run: go test -race -count=1 ./...

      - name: Test without race detector
        if: ${{ !matrix.race }}
        run: go test -count=1 ./...
